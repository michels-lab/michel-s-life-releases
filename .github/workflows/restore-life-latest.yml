name: Restore Michel's Life as this repository's latest release

on:
  push:
    branches: [main]
    paths:
      - 'maintenance/RESTORE_LIFE_LATEST.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-latest:
    if: github.repository == 'michels-lab/michel-s-life-releases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require LouderMe publisher removal and safe feed redirection
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .github/workflows/louderme-desktop-publish.yml
          test ! -f .github/workflows/louderme-direct-publish.yml
          test ! -f .github/workflows/louderme-unified-source-publish.yml
          python3 - <<'PY'
          import json
          for path in ('louderme/latest.json', 'louderme-desktop/latest.json'):
              d=json.load(open(path))
              u=d['apkUrl'] if path.startswith('louderme/') else d['installerUrl']
              if not u.startswith('https://github.com/michels-lab/LouderME-Releases/releases/download/'):
                  raise SystemExit('Legacy feed not yet pointing into LouderMe-only repo: '+path)
              print('LEGACY_COMPATIBLE',path)
          PY
      - name: Correct GitHub latest-release pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v3.0.216 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit v3.0.216 --repo "$GITHUB_REPOSITORY" --latest
          FOUND="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          test "$FOUND" = "v3.0.216"
          echo "LIFE_LATEST_RESTORED: $FOUND"
