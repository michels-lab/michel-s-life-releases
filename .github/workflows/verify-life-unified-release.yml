name: Verify Michel's Life public unified Windows + Android release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/verify-life-unified-release.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify real public assets, distinct platform versions and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public release lists Windows v3.0.216 and current Android v0.2.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO=michels-lab/michel-s-life-releases
          gh release view v3.0.216 --repo "$REPO" --json assets,name,isPrerelease,isDraft --jq . > release.json
          jq -e '.name | contains("Windows v3.0.216 + Android v0.2.2")' release.json
          jq -e '.isPrerelease == false and .isDraft == false' release.json
          jq -r '.assets[].name' release.json | sort > published-assets.txt
          for name in \
            MichelsLife-Setup-v3.0.216.exe \
            MichelsLife-Setup-v3.0.216.exe.sha256 \
            MichelsLife-Portable-v3.0.216.exe \
            MichelsLife-Portable-v3.0.216.exe.sha256 \
            MichelsLife-v3.0.216.exe \
            MichelsLife-v3.0.216.exe.sha256 \
            AppBundle.zip michels_life_icon.ico \
            MichelsLife-Android-v0.2.2-TEST.apk \
            MichelsLife-Android-v0.2.2-TEST.apk.sha256 \
            android-v0.2.2-manifest.json android-signing-certificate.txt; do
            grep -Fxq "$name" published-assets.txt || { echo "::error::Public unified release missing $name"; exit 1; }
          done
          if grep -E '^MichelsLife-Android-v0\.2\.1' published-assets.txt; then
            echo "::error::Obsolete Android v0.2.1 found on current unified release"
            exit 1
          fi
          echo "Public release names, contents and both version lines verified"
      - name: Verify downloadable Android APK actual SHA-256 against public sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download v3.0.216 --repo michels-lab/michel-s-life-releases --dir verify \
            --pattern 'MichelsLife-Android-v0.2.2-TEST.apk*' \
            --pattern 'android-v0.2.2-manifest.json' \
            --pattern 'android-signing-certificate.txt'
          cd verify
          sha256sum -c MichelsLife-Android-v0.2.2-TEST.apk.sha256
          jq -e '.versionName == "0.2.2" and .versionCode == 4 and .applicationId == "com.michelslab.michelslife" and .windows_public_release == "v3.0.216" and .distribution == "direct-test-apk"' android-v0.2.2-manifest.json
          actual="$(sha256sum MichelsLife-Android-v0.2.2-TEST.apk | awk '{print $1}')"
          test "$actual" = "$(jq -r .sha256 android-v0.2.2-manifest.json)"
          test "$actual" = "a6ae2debe8f55d58e41d35b8b85b26feac1235d27216ac8668fac7cc27d085c8"
          test -s android-signing-certificate.txt
          echo "PUBLIC UNIFIED RELEASE VERIFIED: Windows 3.0.216 + Android 0.2.2 code 4, same tag, APK SHA-256 $actual"
