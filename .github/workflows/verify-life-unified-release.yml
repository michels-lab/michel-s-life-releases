name: Verify latest Michel's Life unified customer release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-life-unified-release.yml'
      - 'tools/verify_latest_life_release.py'
      - 'tools/test_verify_latest_life_release.py'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/verify-life-unified-release.yml'
      - 'tools/verify_latest_life_release.py'
      - 'tools/test_verify_latest_life_release.py'
      - '.michelslab/release-intents/life-*-destination.txt'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.repository == 'michels-lab/michel-s-life-releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline version-agnostic asset, provenance, and digest security tests
        run: python3 -m unittest discover -s tools -p 'test_verify_latest_life_release.py' -v
      - name: Verify current actual public release 13 assets, three downloaded binaries, permanent Android signer and source CI
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_latest_life_release.py --repo "$GITHUB_REPOSITORY" --directory artifacts/verified-latest
      - name: Preserve validation metadata, no user-private files
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MichelsLife-latest-public-release-verification
          path: |
            artifacts/verified-latest/android-v*-manifest.json
            artifacts/verified-latest/release-provenance.json
            artifacts/verified-latest/*.sha256
          if-no-files-found: warn
          retention-days: 14
