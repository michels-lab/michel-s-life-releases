name: Complete unified Michel's Life Windows v3.0.216 and latest Android v0.2.2 release

on:
  push:
    branches: [main]
    paths:
      - 'michels-life/android-v0.2.2-unified-v3.0.216.json'

permissions:
  contents: write

concurrency:
  group: michels-life-unified-v3-0-216
  cancel-in-progress: false

jobs:
  publish-unified:
    if: >-
      github.repository == 'michels-lab/michel-s-life-releases' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, '[complete unified life android v0.2.2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify request and already published Windows binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.authorized == true and .android_version == "0.2.2" and .version_code == 4 and .windows_version == "3.0.216" and .public_tag == "v3.0.216" and .source_tag == "michels-life-android-transfer-v0.2.2"' michels-life/android-v0.2.2-unified-v3.0.216.json
          gh release view v3.0.216 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing-assets.txt
          for file in AppBundle.zip michels_life_icon.ico MichelsLife-Setup-v3.0.216.exe MichelsLife-Setup-v3.0.216.exe.sha256 MichelsLife-Portable-v3.0.216.exe MichelsLife-Portable-v3.0.216.exe.sha256 MichelsLife-v3.0.216.exe MichelsLife-v3.0.216.exe.sha256; do
            grep -Fxq "$file" existing-assets.txt || { echo "::error::Missing Windows asset $file"; exit 1; }
          done
      - name: Download verified latest Android from source staging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-dist
          gh release download michels-life-android-transfer-v0.2.2 \
            --repo michels-lab/michel-s-life --dir android-dist
      - name: Verify Android version, source tag provenance, APK integrity and signing evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd android-dist
          FILE=MichelsLife-Android-v0.2.2-TEST.apk
          test -s "$FILE"
          test -s "$FILE.sha256"
          test -s android-signing-certificate.txt
          test -s android-v0.2.2-manifest.json
          sha256sum -c "$FILE.sha256"
          jq -e '.versionName == "0.2.2" and .versionCode == 4 and .applicationId == "com.michelslab.michelslife" and .windows_public_release == "v3.0.216" and .distribution == "direct-test-apk"' android-v0.2.2-manifest.json
          sha="$(sha256sum "$FILE" | awk '{print $1}')"
          test "$sha" = "$(jq -r '.sha256' android-v0.2.2-manifest.json)"
          tag_sha="$(gh api repos/michels-lab/michel-s-life/git/ref/tags/michels-life-android-transfer-v0.2.2 --jq '.object.sha')"
          test "$tag_sha" = "$(jq -r '.source_sha' android-v0.2.2-manifest.json)"
          echo "Validated latest source Android v0.2.2, versionCode 4, sha256 $sha"
      - name: Append Android to SAME existing stable release (do not create another)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v3.0.216
          title="Michel's Life — Windows v3.0.216 + Android v0.2.2"
          # Preserve Windows assets; add exactly latest Android APK and SHA, plus signing and provenance.
          gh release upload "$tag" \
            android-dist/MichelsLife-Android-v0.2.2-TEST.apk \
            android-dist/MichelsLife-Android-v0.2.2-TEST.apk.sha256 \
            android-dist/android-v0.2.2-manifest.json \
            android-dist/android-signing-certificate.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > previous-notes.md
          cat > unified-notes.md <<'NOTES'
          # Michel's Life — unified Windows v3.0.216 + Android v0.2.2

          **Both current platform versions are on this same public release page.**
          - **Windows v3.0.216:** Recommended Setup installer, optional Portable, compatibility updater alias, SHA-256 checksums.
          - **Android v0.2.2 (versionCode 4):** `MichelsLife-Android-v0.2.2-TEST.apk` with SHA-256 and signing certificate metadata. This is the most recent Android version present in the source repository, NOT an older v0.2.1 build.
          - **Android APK signing:** This direct-download APK is **debug/test signed** (not a stable production sideload signature and not a Google Play release). Because debug signing keys can change between builds, it may fail to install as an update over a differently signed existing APK. **Back up your data before considering any uninstall or fresh installation.** Do not delete existing app data without a recoverable backup.
          - **Google Play / Microsoft Store:** These provider-managed publications are separate, and are not claimed here.
          - **Cloud sync:** Back up locally before attempting Windows↔Android synchronization. Live same-account cross-device conflicts/restore remain unverified on physical devices.

          ## Windows changes and detailed notes
          NOTES
          cat previous-notes.md >> unified-notes.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file unified-notes.md --prerelease=false
      - name: Verify final unified release assets and versions together
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v3.0.216 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > published-assets.txt
          for file in MichelsLife-Setup-v3.0.216.exe MichelsLife-Portable-v3.0.216.exe MichelsLife-v3.0.216.exe AppBundle.zip michels_life_icon.ico MichelsLife-Android-v0.2.2-TEST.apk MichelsLife-Android-v0.2.2-TEST.apk.sha256 android-v0.2.2-manifest.json android-signing-certificate.txt; do
            grep -Fxq "$file" published-assets.txt || { echo "::error::Unified release missing $file"; exit 1; }
          done
          gh release view v3.0.216 --repo "$GITHUB_REPOSITORY" --json title --jq .title | grep -F "Android v0.2.2"
          echo "PUBLIC UNIFIED RELEASE PASS: Windows 3.0.216 + Android 0.2.2 in same release"
