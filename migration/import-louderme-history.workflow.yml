name: Import LouderMe history into its own repository
# TEMPLATE ONLY: copy this into michels-lab/LouderMe-releases at
# .github/workflows/import-louderme-history.yml after creating that repository.
on:
  push:
    branches: [main]
    paths: ['migration/START.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: louderme-history-import
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'michels-lab/LouderMe-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: michels-lab/michel-s-life-releases
      TARGET: michels-lab/LouderMe-releases
    steps:
      - uses: actions/checkout@v4
      - name: Import source release assets without modifying source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$TARGET"
          gh api "repos/$SOURCE/releases?per_page=100" > /tmp/louderme-releases.json
          mkdir -p /tmp/louderme-migration
          jq -r '.[] | select(.tag_name | startswith("louderme-")) | [.published_at,.tag_name] | @tsv' /tmp/louderme-releases.json | sort | cut -f2 > /tmp/louderme-tags
          test -s /tmp/louderme-tags
          while IFS= read -r TAG; do
            D="/tmp/louderme-migration/$TAG"
            mkdir -p "$D"
            gh release download "$TAG" --repo "$SOURCE" --dir "$D"
            python3 - "$D" <<'PY'
          import hashlib,pathlib,re,sys
          directory=pathlib.Path(sys.argv[1])
          files=list(directory.iterdir())
          if not files: raise SystemExit(f'No source assets in {directory}')
          for sidecar in directory.glob('*.sha256'):
              binary=directory/sidecar.name[:-7]
              if not binary.exists(): raise SystemExit(f'Missing original binary: {binary}')
              expected=re.search(r'\b[0-9a-fA-F]{64}\b',sidecar.read_text())
              if not expected: raise SystemExit(f'Invalid checksum: {sidecar}')
              actual=hashlib.sha256(binary.read_bytes()).hexdigest()
              if actual.lower()!=expected.group().lower(): raise SystemExit(f'Checksum mismatch: {binary}')
          print(f'Original verified assets: {len(files)}')
          PY
            if ! gh release view "$TAG" --repo "$TARGET" >/dev/null 2>&1; then
              TITLE="$(jq -r --arg t "$TAG" '.[]|select(.tag_name==$t)|.name' /tmp/louderme-releases.json)"
              jq -r --arg t "$TAG" '.[]|select(.tag_name==$t)|.body // ""' /tmp/louderme-releases.json > /tmp/louderme-release-notes
              gh release create "$TAG" "$D"/* --repo "$TARGET" --target main --title "$TITLE" --notes-file /tmp/louderme-release-notes
            fi
            gh api "repos/$TARGET/releases/tags/$TAG" > "/tmp/louderme-$TAG.json"
            python3 - "$TAG" <<'PY'
          import json,sys
          tag=sys.argv[1]
          old=next(x for x in json.load(open('/tmp/louderme-releases.json')) if x['tag_name']==tag)
          new=json.load(open('/tmp/louderme-'+tag+'.json'))
          a={x['name']:x['size'] for x in old['assets']}
          b={x['name']:x['size'] for x in new['assets']}
          if a!=b: raise SystemExit(f'Migrated asset list/size drift in {tag}')
          print('MIGRATED',tag,len(a))
          PY
          done < /tmp/louderme-tags
      - name: Prepare new standalone Android and Windows feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          old='michels-lab/michel-s-life-releases'
          new='michels-lab/LouderMe-releases'
          for path in ('louderme/latest.json','louderme-desktop/latest.json'):
              with urlopen('https://raw.githubusercontent.com/'+old+'/main/'+path,timeout=30) as r:
                  data=json.load(r)
              keys=['apkUrl','releaseUrl'] if path.startswith('louderme/') else ['installerUrl','portableUrl','releaseUrl']
              for key in keys:
                  assert old in data[key],(path,key)
                  data[key]=data[key].replace(old,new)
              Path(path).parent.mkdir(parents=True,exist_ok=True)
              Path(path).write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name "Michel's Lab Release Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add louderme/latest.json louderme-desktop/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "release: seed isolated LouderMe update feeds"
            git push
          fi
      - name: Verify remote public download links before cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from urllib.request import Request,urlopen
          for path in ('louderme/latest.json','louderme-desktop/latest.json'):
              data=json.load(open(path))
              keys=['apkUrl','releaseUrl'] if path.startswith('louderme/') else ['installerUrl','portableUrl','releaseUrl']
              for key in keys:
                  url=data[key]
                  assert url.startswith('https://github.com/michels-lab/LouderMe-releases/releases/')
                  with urlopen(Request(url,method='HEAD',headers={'User-Agent':'MichelsLabMigration'}),timeout=60) as response:
                      assert response.status==200,(key,url,response.status)
              print('DESTINATION_LINKS_VERIFIED',path)
          PY
          echo 'Import complete. Legacy client redirects and publisher cutover still required; do not delete old releases.'
